name: Affectra SBOM upload
description: Upload SBOMs to an Affectra release, named by product, variant and version.
author: Affectra
branding:
  icon: upload-cloud
  color: blue

inputs:
  url:
    description: Base URL of your Affectra instance, e.g. https://affectra.example.com
    required: true
  organization:
    description: Your Affectra organization (the slug in its URLs). Must be the API key's organization, or trust this repository.
    required: true
  api-key:
    description: >-
      An Affectra organization API key (exk_...), from a secret. Leave it out to use the
      job's GitHub OIDC token instead (needs permissions id-token: write, and the
      repository trusted in Affectra under Trusted publishers).
    required: false
    default: ""
  audience:
    description: Audience of the GitHub OIDC token. Defaults to url; set it only if your Affectra admin says so.
    required: false
    default: ""
  product:
    description: Product name. Created if it does not exist.
    required: true
  variant:
    description: >-
      Variant of the product (a hardware revision, platform, edition or SKU). Created if the
      product has no variant with this name. Leave it out for the product's default variant.
    required: false
    default: ""
  version:
    description: Release version, e.g. the tag name (github.ref_name) on a tag build. Created if new.
    required: true
  sbom:
    description: SBOM files to upload, one path or glob per line (** works). All go to the same release.
    required: true
  released-at:
    description: Release date (RFC 3339, e.g. 2026-11-05T12:00:00Z). Used only when the release is created.
    required: false
    default: ""
  sign:
    description: >-
      true signs each SBOM with Sigstore (cosign sign-blob, keyless) and uploads the signature with it.
      Needs cosign 2.4 or later on the runner (sigstore/cosign-installer) and permissions id-token write.
      Without it, a <file>.sigstore.json next to an SBOM is uploaded as its signature.
    required: false
    default: "false"

outputs:
  release-id:
    description: ID of the release the SBOMs went to
    value: ${{ steps.upload.outputs.release-id }}
  release-url:
    description: Link to the release in the Affectra web app
    value: ${{ steps.upload.outputs.release-url }}
  sbom-ids:
    description: IDs of the uploaded SBOMs, one per line, in file order
    value: ${{ steps.upload.outputs.sbom-ids }}

runs:
  using: composite
  steps:
    - id: upload
      shell: bash
      # Inputs reach the script only as environment variables, never as
      # ${{ }} inside the script, so their values cannot inject shell code.
      env:
        AFFECTRA_URL: ${{ inputs.url }}
        AFFECTRA_ORG: ${{ inputs.organization }}
        AFFECTRA_API_KEY: ${{ inputs.api-key }}
        AFFECTRA_AUDIENCE: ${{ inputs.audience }}
        AFFECTRA_PRODUCT: ${{ inputs.product }}
        AFFECTRA_VARIANT: ${{ inputs.variant }}
        AFFECTRA_VERSION: ${{ inputs.version }}
        AFFECTRA_SBOM: ${{ inputs.sbom }}
        AFFECTRA_RELEASED_AT: ${{ inputs.released-at }}
        AFFECTRA_SIGN: ${{ inputs.sign }}
      run: bash "$GITHUB_ACTION_PATH/upload.sh"
